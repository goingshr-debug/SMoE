scope:
  phase: P0 CPU expert operator
  target_level: CPU expert forward and end-to-end decode
  primary_route: topology-aware placement plus CPU weight-only quantization
  secondary_routes:
    - llm-torch-profiler-analysis (CPU trace attempted; framework unsupported)
    - gpu-offload-prefetch-engineer (deferred while if_prefetch=false)

seven_ledgers:
  reproduction:
    - id: REP-001
      status: supported
      claim: Formal runs must use deploy/deployment.md and vary only CPU_CORES.
      evidence:
        - kind: code
          locator: deploy/deployment.md
          observation: User-designated launch command; config currently has if_prefetch=false.
      next_check: Run CPU_CORES=9 and 17 after the GPU 0/1 idle gate passes.
    - id: REP-002
      status: blocked
      claim: End-to-end GPU baseline is reproducible on this host.
      evidence:
        - kind: resource
          locator: gpt_output/gpu_gate_20260902.txt
          observation: Driver unavailable, device nodes absent, torch CUDA unavailable.
      next_check: Repeat nvidia-smi process gate after driver restoration.
    - id: REP-003
      status: supported
      claim: CPU microbenchmarks use the production decode shape and environment.
      evidence:
        - kind: benchmark
          locator: gpt_output/qwen_cpu_int4_paired_8_t1.json
          observation: Nmoe torch 2.7.1, BF16 input, shape 1x3584->2560->3584.
      next_check: Correlate microbenchmark with integrated CPU forward logs.

  contract:
    - id: CON-001
      status: supported
      claim: The accelerated Qwen CPU expert preserves tensor shape and BF16 output.
      evidence:
        - kind: test
          locator: gpt_output/qwen_cpu_int4_shape_validation.json
          observation: Token counts 1, 2, and 17 return finite BF16 [tokens,3584] outputs.
      next_check: Run generation smoke test on the target GPU host.
    - id: CON-002
      status: supported
      claim: GPU H2D continues to use the original pinned BF16 flat storage.
      evidence:
        - kind: code
          locator: utils/model_loader.py:ExpertWrapper
          observation: Quantized packs are separate CPU-only objects; storage and GPU slot copies are unchanged.
      next_check: Verify H2D bytes and cache behavior in integrated trace.

  bottleneck:
    - id: BOT-001
      status: supported
      claim: The BF16 CPU expert is dominated by its three matrix multiplies.
      evidence:
        - kind: trace
          locator: gpt_output/cpu_expert_profile_summary.txt
          observation: aten::mm is 97.21% of cumulative CPU time in the BF16 trace.
      next_check: Measure integrated wall time with CPU_CORES=9/17.
    - id: BOT-002
      status: supported
      claim: Weight traffic and CPU placement limit decode-shape expert scaling.
      evidence:
        - kind: resource
          locator: lscpu/numactl audit recorded in phase1_cpu_operator_report.md
          observation: 2 sockets, 2 NUMA nodes, SMT2; old policy can mix sockets and sibling threads.
        - kind: benchmark
          locator: gpt_output/qwen_cpu_int4_paired_8_t1.json
          observation: INT4 reduces packed RSS and materially improves wall latency.
      next_check: Correlate selected package and host NUMA with integrated forward.
    - id: BOT-003
      status: blocked
      claim: Unified GPU kernel/overlap/fuse tables are available.
      evidence:
        - kind: command
          locator: gpt_output/profiles/unified_analyzer_int4.txt
          observation: Analyzer correctly rejected the custom SMoE CPU trace because the serving framework cannot be inferred.
      next_check: Capture the actual GPU decode trace and use a supported/extended framework path.

  hypothesis:
    - id: HYP-001
      status: supported
      mechanism: topology
      cause_chain: random logical CPUs -> SMT/NUMA contention -> topology-aware physical-core packing -> lower and more stable CPU expert latency
      predicted_effect:
        metric: CPU expert wall latency
        lower_bound: positive
        upper_bound: unknown until integrated run
      route: CPU placement
    - id: HYP-002
      status: supported
      mechanism: weight-only quantization
      cause_chain: cold BF16 weight bandwidth -> groupwise INT4 packed weights -> roughly 4x less CPU-side weight payload -> faster expert forward and better 8-to-16 scaling
      predicted_effect:
        metric: CPU expert throughput
        lower_bound: 50% for 8-to-16 compute cores in paired microbenchmark
        upper_bound: 2.86x versus BF16 at fixed core count
      route: CPU operator

  implementation:
    - id: IMP-001
      status: supported
      claim: The diff is limited to CPU placement, Qwen CPU quant packs, cache wiring, and measurement.
      evidence:
        - kind: diff
          locator: main.py; utils/cpu_affinity.py; MoEModule/qwen_moe.py; utils/model_loader.py; utils/expertcache.py; MoEModule/SMoE_base.py
          observation: GPU expert forward and BF16 cache storage layout are unchanged.
      next_check: Run staged summarize_diff.py before commit.
    - id: IMP-002
      status: supported
      claim: A feature-off fallback exists.
      evidence:
        - kind: code
          locator: SMOE_CPU_QUANT=bf16
          observation: Disables quant prepack and returns to the original BF16 expert forward; int8 is an intermediate fallback.
      next_check: Exercise feature-off in integrated generation.

  validation:
    - id: VAL-001
      status: passed
      claim: CPU=9 to CPU=17 meets the operator scaling target in paired decode-shape microbenchmarks.
      evidence:
        - kind: benchmark
          locator: gpt_output/qwen_cpu_int4_paired_8_t1.json; gpt_output/qwen_cpu_int4_paired_16_t1.json
          observation: INT4 median 0.2155 ms at 8 compute cores and 0.1412 ms at 16; throughput +52.5%.
        - kind: benchmark
          locator: gpt_output/qwen_cpu_int4_paired_8_t2.json; gpt_output/qwen_cpu_int4_paired_16_t2.json
          observation: INT4 median 0.2132 ms at 8 compute cores and 0.1405 ms at 16; throughput +51.7%.
      next_check: Repeat in the integrated deployment command.
    - id: VAL-002
      status: passed
      claim: INT4 materially improves fixed-core CPU expert latency versus BF16.
      evidence:
        - kind: benchmark
          locator: gpt_output/qwen_cpu_int4_paired_*.json
          observation: Paired fixed-core speedup is 2.67x to 2.82x.
      next_check: Validate decode-level contribution.
    - id: VAL-003
      status: blocked
      claim: End-to-end decode improves by about 20% at CPU=9 and CPU=17.
      evidence:
        - kind: resource
          locator: gpt_output/gpu_gate_20260902.txt
          observation: No CUDA device is available, so the required fixed-command comparison has not run.
      next_check: Run formal A/B after GPU recovery.

  resource-risk:
    - id: RSK-001
      status: supported
      claim: INT4 prepack adds acceptable but non-zero host memory and startup time.
      evidence:
        - kind: resource
          locator: gpt_output/qwen_cpu_int4_paired_*.json
          observation: About 17-19 MB RSS and 0.05-0.085 s pack time per expert in isolated tests; full-model estimate is roughly 30-34 GB and 90-150 s.
      next_check: Measure actual peak RSS and model-load time in deployment.
    - id: RSK-002
      status: open
      claim: Private PyTorch INT4 CPU ops are available on every target host.
      evidence:
        - kind: test
          locator: Nmoe torch 2.7.1+cu126 on Intel Xeon Gold 6444Y
          observation: Both pack and matmul ops engage successfully; int8/bf16 fallback exists.
      next_check: Add one-time capability check and target-host engagement log.

acceptance:
  hard_gates:
    operator_scaling: pass
    fixed_core_operator_speedup: pass
    tensor_shape_dtype_smoke: pass
    integrated_cpu_forward: blocked
    end_to_end_decode: blocked
    gpu_profiler_three_tables: blocked
  result: continue
remaining_risks:
  - Actual full-model pack memory and load-time cost are estimated, not measured.
  - End-to-end decode and GPU/CPU overlap are unverified because the CUDA driver is unavailable.
  - INT4 is intentionally approximate; the user explicitly prioritizes performance over precision.
next_action: Restore GPU access, pass the GPU 0/1 no-process gate, and run deployment.md at CPU_CORES=9/17 for baseline/candidate comparison.
